  <script>
    // 优化后的JavaScript代码
    const audio = document.getElementById('audio');
    const lyricsViewport = document.getElementById('lyricsViewport');
    const lyricLines = document.querySelectorAll('.lyric-line');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const playButton = document.getElementById('playButton');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    // 格式化时间显示
    const formatTime = (seconds) => {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    };

    // 播放/暂停控制
playButton.addEventListener('click', () => {
  if (audio.paused && playButton.dataset.state !== 'stopped') {
    audio.play();
    playButton.textContent = '❚❚';
  } else if (playButton.dataset.state === 'stopped') {
    audio.currentTime = 0; // 重置进度
    audio.play();
    playButton.textContent = '❚❚';
    playButton.dataset.state = 'playing';
  } else {
    audio.pause();
    playButton.textContent = '▶';
  }
});

    // 进度条点击跳转
    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audio.currentTime = percent * audio.duration;
    });

    // 歌词同步核心逻辑
    const syncLyrics = () => {
      const currentTime = audio.currentTime;
      let activeLineIndex = -1;

      lyricLines.forEach((line, index) => {
        const lineTime = parseFloat(line.dataset.time);
        if (currentTime >= lineTime) {
          activeLineIndex = index;
        }
        line.classList.remove('active');
      });

      if (activeLineIndex >= 0) {
        const activeLine = lyricLines[activeLineIndex];
        activeLine.classList.add('active');
        
        // 自动滚动到当前歌词
        const viewportHeight = lyricsViewport.clientHeight;
        const lineTop = activeLine.offsetTop;
        const lineHeight = activeLine.clientHeight;
        lyricsViewport.scrollTo({
          top: lineTop - (viewportHeight / 2) + (lineHeight / 2),
          behavior: 'smooth'
        });
      }
    };

    // 音频时间更新事件
    audio.addEventListener('timeupdate', () => {
      // 更新进度条
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      progress.style.width = `${progressPercent}%`;
      
      // 更新时间显示
      currentTimeEl.textContent = formatTime(audio.currentTime);
      
      // 同步歌词
      syncLyrics();
    });

    // 加载元数据后更新总时长
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('ended', () => {
      playButton.textContent = '⏹';
      playButton.dataset.state = 'stopped'; // 标记状态
    });
    // 错误处理
    audio.addEventListener('error', () => {
      console.error("音频加载错误");
      playButton.disabled = true;
    });
    document.getElementById('backBtn').addEventListener('click', function() {
      window.location.href = 'top1.html';
    });
     // 计算部分
    const counter = document.getElementById('counter');
    const count = parseInt(localStorage.getItem('pageCount')) || 0;
    localStorage.setItem('pageCount', count + 1);
    counter.textContent = count + 1;
  </script>
