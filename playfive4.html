  <title>星穹KTV5#时间歌词播放器</title>
  <style>
    /* 视觉设计系统 */
    :root {
      --primary: #f8a407;
      --secondary: #3f37c9;
      --text: #2b2d42;
      --bg: #34393f2d;
    }
        body {
            background: url('img/沉浮一杯.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
        }    
        /* 播放器核心样式 */
        .lyric-container {
            width: 95vw;
            margin: 10px auto;
            font-family: "Microsoft YaHei", sans-serif;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .audio-controls {
            background: transparent !important;
            flex-direction: column;
            padding: 8px 0;
        }
        #audio {
            width: 100%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            opacity: 0.5;
        }
        .lyric-viewport {
            height: 60vh; /* 占据60%屏幕高度 */
            overflow-y: auto;
            padding: 10px 15px;
            scroll-behavior: smooth;
            background: rgba(255, 255, 255, 0.01);
        }
        .lyric-line {
            text-align: center;
            padding: 8px 0;
            margin: 5px 0;
            color: #6d706eb7;
            font-size: clamp(16px, 4.5vw, 20px); /* 随屏幕宽度动态调整 */
            font-weight: bold;
            line-height: 1.6;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-left: 3px solid transparent;
        }
        .lyric-line.active {
            color: #0df705;
            font-weight: 600;
            transform: translateX(5px);
            border-left-color: #00000000;
            background: rgba(255, 255, 255, 0);
        }
        /* 增强滚动条 */
        .lyric-viewport::-webkit-scrollbar {
            width: 8px;
        }
        .lyric-viewport::-webkit-scrollbar-thumb {
            background: #00000000;
            border-radius: 4px;
        }
        @media (orientation: landscape) {
        .lyric-container {
            width: 70vw;
            }
        .lyric-viewport {
            height: 70vh;
            }
        }        
    </style>
</head>
<body>
    <div class="lyric-container">
        <div class="audio-controls">
            <audio id="audio" controls>
                <source src="/mp3/沉浮一生.mp3" type="audio/mpeg">
                您的浏览器不支持音频元素
            </audio><a href="top1.html" style="color: white; text-decoration: none;">返回首页</a>
        </div>
        <div class="lyric-viewport" id="lyrics">
<div class="lyric-line" data-time="00:00.77">[Tunee音乐]</div>
<div class="lyric-line" data-time="00:22.48">一片青叶沉浮岁月长</div>

<div class="lyric-line" data-time="00:33.43">苦是修行</div>
<div class="lyric-line" data-time="00:35.81">甘是奖赏</div>
<div class="lyric-line" data-time="00:38.99">沉时坦然</div>
<div class="lyric-line" data-time="00:41.19">浮时明亮</div>
<div class="lyric-line" data-time="00:46.18">啊 这一杯光阴的茶</div>
<div class="lyric-line" data-time="00:51.10">浓淡都是年华</div>
<div class="lyric-line" data-time="00:56.17">掌心温度暖了霜花</div>
<div class="lyric-line" data-time="01:01.55">你看那远山含笑</div>

<div class="lyric-line" data-time="01:59.02">浓淡都是年华</div>
<div class="lyric-line" data-time="02:03.85">掌心温度暖了霜花</div>
<div class="lyric-line" data-time="02:09.41">你看那远山含笑</div>
<div class="lyric-line" data-time="02:15.12">静待新芽</div>
        </div>
    </div>

    <script>
        // 高性能时间解析器
        const parseTime = (timeStr) => {
            const [mmss, ms] = timeStr.split('.');
            const [mm, ss] = mmss.split(':');
            return (+mm * 60) + (+ss) + (+ms / 100);
        };
// 增加歌词点击跳转功能
document.querySelectorAll('.lyric-line').forEach(line => {
  line.addEventListener('click', () => {
    const time = parseTime(line.dataset.time);
    audio.currentTime = time;
  });
});

        // 播放器核心逻辑
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio');
            const lyricsContainer = document.getElementById('lyrics');
            const lyricElements = Array.from(document.querySelectorAll('.lyric-line'));
            
            // 预计算时间点
            const timePoints = lyricElements.map(el => ({
                element: el,
                time: parseTime(el.dataset.time)
            }));

            // 优化性能的歌词同步
            let lastActiveIndex = -1;
            audio.addEventListener('timeupdate', () => {
                const currentTime = audio.currentTime;
                
                // 二分查找当前歌词
                let low = 0, high = timePoints.length - 1;
                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);
                    if (timePoints[mid].time < currentTime + 0.3) {
                        low = mid + 1;
                    } else {
                        high = mid - 1;
                    }
                }
                
                const activeIndex = Math.max(0, high);
                if (activeIndex !== lastActiveIndex) {
                    if (lastActiveIndex >= 0) {
                        timePoints[lastActiveIndex].element.classList.remove('active');
                    }
                    timePoints[activeIndex].element.classList.add('active');
                    
                    // 智能滚动定位
                    const { offsetTop, offsetHeight } = timePoints[activeIndex].element;
                    lyricsContainer.scrollTo({
                        top: offsetTop - (lyricsContainer.clientHeight / 2) + (offsetHeight / 2),
                        behavior: 'smooth'
                    });
                    
                    lastActiveIndex = activeIndex;
                }
            });
        });        
    </script>
</body>
