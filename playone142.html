    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星穹KTV1#《多元审美筑同心》音乐跳转播放系统</title>
    <style>
	    body {
            margin: 0;
			min-height: 100dvh;
			display: flex;
			justify-content: center;
			align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            text-align: center;
        }
        /* 列表页样式 */
        .song-list {
			width: 80%;
			height: auto;
        }
        .song-item {
            padding: 12px;
            border-bottom: 6px solid #ddd;
            display: flex;
            justify-content: space-between;
        }       
        /* 播放页样式 */
        .player-page {
			width: 50%;
            text-align: center;
            padding: 2rem;
        }
        audio {
            width: 80%;
            margin: 1rem 0;
            opacity: 0.5;
        }
        /* 酷炫悬浮动画 */
        .hero-banner {
            position: relative;
            height: 50dvh;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .hero-banner:hover img {
            transform: scale(1.03) rotate(0.5deg);;
        }
        /* 播放器玻璃态效果 */
        .player-container {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 0 0 15px 15px;
        }
        /* 动态光效 */
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        @media (max-width: 768px) {  
            .player-page { width: 90%; }  
            .song-list { width: 95%; }  
            .hero-banner { height: 40dvh; }  
        }        
    </style>
</head>
<body>
    <!-- 列表页 -->
    <div class="song-list" id="listPage">
        <h2>歌曲列表</h2>
        <div class="song-item">
            <a href="playone142.html?song=/mp3/多元审美筑同心.mp3&title=多元审美筑同心&artist=Google">多元审美筑同心</a>
        </div>
   </div>
    <!-- 播放页（实际应单独为player.html文件） -->
    <div class="player-page" id="playerPage" style="display:none;">
        <div class="hero-banner">
            <img src="/img/多元审美筑同心.png" alt="Banner">
        </div>
        <h2 id="nowPlaying">正在播放</h2>
        <audio id="audioPlayer" controls autoplay></audio>
   	    <p id="songInfo"></p>
        <p></p><a href="top1.html" onclick="history.back()">返回列表</a>

    </div>

    <script>
        // URL参数解析（实际应用中应拆分为两个HTML文件）
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('song')) {
            document.getElementById('listPage').style.display = 'none';
            document.getElementById('playerPage').style.display = 'block';
            
            const player = document.getElementById('audioPlayer');
            player.src = decodeURIComponent(urlParams.get('song'));
            document.getElementById('songInfo').textContent = 
                `${decodeURIComponent(urlParams.get('title'))} - ${decodeURIComponent(urlParams.get('artist'))}`;
            player.play().catch(e => console.log("自动播放受限:", e));
        }

        // 实际部署时应：
        // 1. 将播放器页面单独保存为player.html
        // 2. 列表页链接改为：<a href="player.html?song=我们的星球.mp3&title=我们的星球&artist=Muse">
        // 3. 删除本示例中的display切换逻辑
    </script>
</body>
</html>
