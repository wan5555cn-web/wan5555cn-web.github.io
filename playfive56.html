  <meta charset="UTF-8">

  <title>星穹KTV5#《光年外的霜》时间歌词播放器</title>
  <style>
    /* 视觉设计系统 */
    :root {
      --primary: #ff0000;
      --secondary: #3f37c9;
      --text: #2b2d42;
      --bg: #34393f2d;
    }
        body {
            background: url('img/光年外的霜.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
        }    
        /* 播放器核心样式 */
        .lyric-container {
            width: 95vw;
            margin: 10px auto;
            font-family: "Microsoft YaHei", sans-serif;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .audio-controls {
            background: transparent !important;
            flex-direction: column;
            padding: 8px 0;
        }
        #audio {
            width: 100%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            opacity: 0.5;
        }
        .lyric-viewport {
            height: 60vh; /* 占据60%屏幕高度 */
            overflow-y: auto;
            padding: 10px 15px;
            scroll-behavior: smooth;
            background: rgba(255, 255, 255, 0.01);
        }
        .lyric-line {
            text-align: center;
            padding: 8px 0;
            margin: 5px 0;
            color: #3b363675;
            font-size: clamp(16px, 4.5vw, 20px); /* 随屏幕宽度动态调整 */
            font-weight: bold;
            line-height: 1.6;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-left: 3px solid transparent;
        }
        .lyric-line.active {
            color: #ff6905;
            font-weight: 600;
            transform: translateX(5px);
            border-left-color: #00000000;
            background: rgba(255, 255, 255, 0);
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.521);
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            color: var(--primary);
        }
        /* 增强滚动条 */
        .lyric-viewport::-webkit-scrollbar {
            width: 8px;
        }
        .lyric-viewport::-webkit-scrollbar-thumb {
            background: #00000000;
            border-radius: 4px;
        }
        @media (orientation: landscape) {
        .lyric-container {
            width: 70vw;
            }
        .lyric-viewport {
            height: 70vh;
            }
        }        
    </style>
</head>
<body>
    <div class="lyric-container">
        <div class="audio-controls">
            <audio id="audio" controls>
                <source src="/mp3/光年外的霜.mp3" type="audio/mpeg">
                您的浏览器不支持音频元素
            </audio><a href="top1.html" style="color: blue; text-decoration: none;">返回首页</a>
        </div>
        <div class="lyric-viewport" id="lyrics">
<div class="lyric-line" data-time="00:00.77">[Muse音乐]</div>
<div class="lyric-line" data-time="00:19.91">（低音电子音效）</div>
<div class="lyric-line" data-time="00:23.72">别回答！那星光藏着猎枪</div>
<div class="lyric-line" data-time="00:30.65">二向箔正折叠成糖霜</div>
<div class="lyric-line" data-time="00:37.62">每个‘你好’都是坐标</div>
<div class="lyric-line" data-time="00:44.34">每句诗篇文明的讣告</div>
<div class="lyric-line" data-time="00:49.77">（弦乐渐亮）</div>
<div class="lyric-line" data-time="00:52.94">但我们仍想触碰光年外的霜</div>
<div class="lyric-line" data-time="00:59.64">用射电望远镜写温柔处方</div>
<div class="lyric-line" data-time="01:06.55">发送圆周率与巴赫</div>
<div class="lyric-line" data-time="01:13.12">而非地球的伤疤</div>
<div class="lyric-line" data-time="01:39.83">（钟摆声采样）</div>
<div class="lyric-line" data-time="01:43.36">当猜疑链绞碎所有玫瑰</div>
<div class="lyric-line" data-time="01:50.23">记得为未知留一道门扉</div>
<div class="lyric-line" data-time="01:57.08">像露珠拥抱晨晖</div>
<div class="lyric-line" data-time="02:04.06">静默却保持星辉</div>
<div class="lyric-line" data-time="02:10.42">静默却保持星辉</div>
        </div>
    </div>

    <script>
        // 高性能时间解析器
        const parseTime = (timeStr) => {
            const [mmss, ms] = timeStr.split('.');
            const [mm, ss] = mmss.split(':');
            return (+mm * 60) + (+ss) + (+ms / 100);
        };
// 增加歌词点击跳转功能
document.querySelectorAll('.lyric-line').forEach(line => {
  line.addEventListener('click', () => {
    const time = parseTime(line.dataset.time);
    audio.currentTime = time;
  });
});

        // 播放器核心逻辑
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio');
            const lyricsContainer = document.getElementById('lyrics');
            const lyricElements = Array.from(document.querySelectorAll('.lyric-line'));
            
            // 预计算时间点
            const timePoints = lyricElements.map(el => ({
                element: el,
                time: parseTime(el.dataset.time)
            }));

            // 优化性能的歌词同步
            let lastActiveIndex = -1;
            audio.addEventListener('timeupdate', () => {
                const currentTime = audio.currentTime;
                
                // 二分查找当前歌词
                let low = 0, high = timePoints.length - 1;
                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);
                    if (timePoints[mid].time < currentTime + 0.3) {
                        low = mid + 1;
                    } else {
                        high = mid - 1;
                    }
                }
                
                const activeIndex = Math.max(0, high);
                if (activeIndex !== lastActiveIndex) {
                    if (lastActiveIndex >= 0) {
                        timePoints[lastActiveIndex].element.classList.remove('active');
                    }
                    timePoints[activeIndex].element.classList.add('active');
                    
                    // 智能滚动定位
                    const { offsetTop, offsetHeight } = timePoints[activeIndex].element;
                    lyricsContainer.scrollTo({
                        top: offsetTop - (lyricsContainer.clientHeight / 2) + (offsetHeight / 2),
                        behavior: 'smooth'
                    });
                    
                    lastActiveIndex = activeIndex;
                }
            });
        });        
    </script>
</body>
