<!DOCTYPE html>
<html>
<head>
  <title>星穹KTV智能歌词编辑器</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    #lyricsDisplay {
      height: 400px;
      overflow-y: auto;
      padding: 20px;
      background: linear-gradient(to bottom, #f8fafc, #f0f4f8);
      border-radius: 8px;
      line-height: 2.2;
      scroll-behavior: smooth;
      font-size: 16px;
    }
    .lyric-line {
      margin: 12px 0;
      transition: all 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
      opacity: 0.7;
    }
    .active {
      color: #2563eb;
      font-weight: 600;
      opacity: 1;
      transform: scale(1.07);
      text-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
    }
    .control-panel {
      margin: 20px 0;
    }
    input[type="range"] {
      width: 180px;
      margin: 8px 0;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      margin-right: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h2>🎵 星穹KTV音乐播放器</h2>
      <audio id="audioPlayer" controls>
        <source src="" type="audio/mpeg">
      </audio>
      <input type="file" id="audioFile" accept="audio/*" style="width:100%; margin:15px 0">
      
      <div class="control-panel">
        <div style="display:flex; gap:20px;">
          <div>
            <label>🔵 高亮时长：<span id="stayTimeValue">4.5秒</span></label>
            <input type="range" id="stayTime" min="1" max="10" step="0.1" value="4.5">
          </div>
          <div>
            <label>🔠 字体大小：<span id="fontSizeValue">16px</span></label>
            <input type="range" id="fontSize" min="12" max="24" step="1" value="16">
          </div>
        </div>
      </div>
      
      <h2>📜 歌词展示</h2>
      <div id="lyricsDisplay"></div>
    </div>
    
    <div class="panel">
      <h2>✏️ 歌词编辑器</h2>
      <textarea id="lyricsEditor" style="width:100%; height:300px; padding:10px; border:1px solid #ddd; border-radius:6px;" 
                placeholder="[00:00.00]歌曲开始\n[00:05.50]第一句歌词..."></textarea>
      <div style="margin-top:15px">
        <button id="loadLyrics" style="background:#4f46e5; color:white">加载歌词</button>
        <button id="saveLyrics" style="background:#10b981; color:white">保存歌词</button>
        <button id="demoLyrics" style="background:#f59e0b; color:white">示例歌词</button>
      </div>
    </div>
  </div>

  <script>
    // 核心配置
    const config = {
      stayTime: 5.5,
      fontSize: 16
    };

    // 初始化UI
    document.addEventListener('DOMContentLoaded', () => {
      // 滑块控制
      document.getElementById('stayTime').addEventListener('input', (e) => {
        config.stayTime = parseFloat(e.target.value);
        document.getElementById('stayTimeValue').textContent = `${config.stayTime.toFixed(1)}秒`;
      });
      
      document.getElementById('fontSize').addEventListener('input', (e) => {
        config.fontSize = parseInt(e.target.value);
        document.getElementById('fontSizeValue').textContent = `${config.fontSize}px`;
        document.getElementById('lyricsDisplay').style.fontSize = `${config.fontSize}px`;
      });

      // 音频加载
      document.getElementById('audioFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById('audioPlayer').src = URL.createObjectURL(file);
          document.getElementById('lyricsDisplay').innerHTML = 
            '<div style="text-align:center;padding:50px 0;color:#64748b">🎧 音乐已加载</div>';
        }
      });

      // 歌词解析
      document.getElementById('loadLyrics').addEventListener('click', parseLyrics);

      // 示例歌词
      document.getElementById('demoLyrics').addEventListener('click', () => {
        document.getElementById('lyricsEditor').value = `[00:00.00]示例歌曲
[00:05.50]这是第一句歌词
[00:10.70]高亮时长已设为5.5秒
[00:16.90]支持动态调整参数
[00:22.30]Enjoy the music!`.trim();
      });

      // 歌词保存
      document.getElementById('saveLyrics').addEventListener('click', () => {
        const blob = new Blob([document.getElementById('lyricsEditor').value], 
          {type: 'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `歌词_${new Date().toLocaleString()}.lrc`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
      });
    });

    // 歌词解析引擎
    function parseLyrics() {
      const editor = document.getElementById('lyricsEditor');
      const display = document.getElementById('lyricsDisplay');
      const lines = editor.value.split('\n');
      let lyricsData = [];
      
      lines.forEach(line => {
        const match = line.match(/^\[(\d+):(\d+)\.(\d+)\](.+)/);
        if (match) {
          const time = parseInt(match[1]) * 60 + parseFloat(`${match[2]}.${match[3]}`);
          lyricsData.push({ time, text: match[4].trim() });
        }
      });
      
      lyricsData.sort((a, b) => a.time - b.time);
      renderLyrics(lyricsData);
    }

    // 歌词渲染
    function renderLyrics(data) {
      const display = document.getElementById('lyricsDisplay');
      display.innerHTML = data.map(item => 
        `<div class="lyric-line" data-time="${item.time}">${item.text}</div>`
      ).join('');
    }

    // 歌词同步系统
    document.getElementById('audioPlayer').addEventListener('timeupdate', function() {
      const currentTime = this.currentTime;
      const lines = document.querySelectorAll('.lyric-line');
      
      lines.forEach(line => {
        const lineTime = parseFloat(line.dataset.time);
        const isActive = currentTime >= lineTime && 
                        currentTime < lineTime + config.stayTime;
        
        line.classList.toggle('active', isActive);
        
        if (isActive && !line._scrolled) {
          line.scrollIntoView({ behavior: 'smooth', block: 'center' });
          line._scrolled = true;
          setTimeout(() => line._scrolled = false, 1000);
        }
      });
    });
  </script>
</body>
</html>
