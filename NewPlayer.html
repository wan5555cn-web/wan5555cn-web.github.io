    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星穹KTV专业级歌词时间轴生成器</title>
    <style>
        /* 动态光效 */
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }      
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .container {
            width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7); / 白色背景，70%透明度 /
            backdrop-filter: blur(5px); / 可选：添加毛玻璃效果 /
            border-radius: 10px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #3498db;
        }
        audio {
            width: 100%;
            margin: 10px 0;
        }
        textarea {
            width: 96%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .time-display {
            font-family: monospace;
            font-size: 1.2em;
            margin: 0 15px;
        }
        .lyric-line {
            padding: 8px;
            margin: 5px 0;
            cursor: pointer;
            border-left: 3px solid transparent;
        }
        .lyric-line:hover {
            background-color: #f0f7ff;
        }
        .lyric-line.active {
            border-left-color: #3498db;
            background-color: #e3f2fd;
            font-weight: bold;
        }
        #output {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            white-space: pre;
            font-family: monospace;
            overflow-x: auto;
        }
        .shortcut-hint {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 10px;
        }
        @media (max-width: 500px) {
          .container { padding: 10px; }
          button { display: block; margin: 5px 0; width: 90%; }
        }        
    </style>
</head>
<body>
    <div class="container">
        <h1>星穹KTV专业级歌词时间轴生成器</h1>
        
        <!-- 音频处理模块 -->
        <div class="section">
            <div class="section-title">1. 音频处理</div>
            <input type="file" id="audioFile" accept="audio/*">
            <audio id="audioPlayer" controls></audio>
            <div id="fileInfo"></div>
        </div>

        <!-- 歌词编辑模块 -->
        <div class="section">
            <div class="section-title">2. 歌词编辑</div>
            <textarea id="lyricInput" placeholder="每行输入一句歌词（空白行用于节奏控制）"></textarea>
            <div style="margin-top: 10px;">
                <button id="confirmLyricsBtn">确认歌词</button>
                <span class="shortcut-hint">提示：按回车键标记当前行时间点</span>
            </div>
        </div>

        <!-- 时间轴标记模块 -->
        <div class="section">
            <div class="section-title">3. 时间轴标记</div>
            <div id="lyricContainer"></div>
            <div style="margin-top: 15px;">
                <button id="playPauseBtn">播放/暂停</button>
                <button id="markTimeBtn">标记当前行</button>
                <span class="time-display" id="currentTime">00:00.00</span>
                <button id="prevLineBtn">上一行</button>
                <button id="nextLineBtn">下一行</button>
            </div>
        </div>

        <!-- 输出模块 -->
        <div class="section">
            <div class="section-title">4. 星穹KTV生成HTML歌词</div>
            <button id="generateHtmlBtn">生成HTML</button>
            <button id="exportLrcBtn">导出LRC</button>
            <div id="output"></div>
        </div>
    </div>

    <script>
        // 全局变量
        let lyricsData = [];
        let currentLineIndex = 0;
        let isLyricsConfirmed = false;

        // DOM元素
        const audioPlayer = document.getElementById('audioPlayer');
        const lyricInput = document.getElementById('lyricInput');
        const lyricContainer = document.getElementById('lyricContainer');
        const currentTimeDisplay = document.getElementById('currentTime');
        const outputDiv = document.getElementById('output');
        const fileInfoDiv = document.getElementById('fileInfo');

        // 初始化歌词数据
        function initLyricsData() {
            const lines = lyricInput.value.split('\n');
            lyricsData = lines.map(text => ({
                text: text.trim(),
                time: null
            }));
            renderLyricLines();
        }
          // 替换多个歌词行的事件绑定
            lyricContainer.addEventListener('click', (e) => {
              if (e.target.closest('.lyric-line')) {
              currentLineIndex = parseInt(e.target.closest('.lyric-line').dataset.index);
              renderLyricLines();
              }
            });
        // 渲染歌词行
        function renderLyricLines() {
            lyricContainer.innerHTML = lyricsData.map((line, index) => 
                `<div class=".lyric-line ${index === currentLineIndex ? 'active' : ''}" data-index="${index}">
                    <span class="time-display">${line.time ? formatTime(line.time) : '未标记'}</span>
                    ${line.text || '(空白行)'}
                </div>`
            ).join('');

            // 绑定歌词行点击事件
            document.querySelectorAll('.lyric-line').forEach(el => {
                el.addEventListener('click', function() {
                    currentLineIndex = parseInt(this.dataset.index);
                    renderLyricLines();
                });
            });
        }

        // 标记当前行时间
        function markCurrentTime() {
            if (isLyricsConfirmed && !isNaN(audioPlayer.currentTime)) {
                lyricsData[currentLineIndex].time = audioPlayer.currentTime;
                currentLineIndex = Math.min(currentLineIndex + 1, lyricsData.length - 1);
                renderLyricLines();
            }
        }

        // 生成HTML歌词
        function generateHtmlLyrics() {
            const html = lyricsData
                .filter(line => line.text) // 过滤空白行
                .map(line => `<div class=".lyric-line" data-time="${line.time ? formatTime(line.time) : '00:00.00'}">${line.text}</div>`)
                .join('\n');
            
            outputDiv.textContent = html;
        }

        // 导出LRC文件
        function exportLrcFile() {
            const lrcContent = lyricsData
                .filter(line => line.text && line.time !== null)
                .map(line => `[${formatTime(line.time)}] ${line.text}`)
                .join('\n');
            
            const blob = new Blob([lrcContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'lyrics.lrc';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 时间格式化 (秒 → mm:ss.xx)
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toFixed(2).padStart(5, '0');
            return `${mins}:${secs}`;
        }

        // 事件监听
        document.getElementById('audioFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileInfoDiv.textContent = `已加载: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`;
                audioPlayer.src = URL.createObjectURL(file);
                audioPlayer.load();
            }
        });

        document.getElementById('confirmLyricsBtn').addEventListener('click', function() {
            if (lyricInput.value.trim()) {
                isLyricsConfirmed = true;
                initLyricsData();
            } else {
                alert('请先输入歌词内容！');
            }
        });

        document.getElementById('playPauseBtn').addEventListener('click', function() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        });

        document.getElementById('markTimeBtn').addEventListener('click', markCurrentTime);
        document.getElementById('prevLineBtn').addEventListener('click', function() {
            currentLineIndex = Math.max(0, currentLineIndex - 1);
            renderLyricLines();
        });
        document.getElementById('nextLineBtn').addEventListener('click', function() {
            currentLineIndex = Math.min(lyricsData.length - 1, currentLineIndex + 1);
            renderLyricLines();
        });
        document.getElementById('generateHtmlBtn').addEventListener('click', generateHtmlLyrics);
        document.getElementById('exportLrcBtn').addEventListener('click', exportLrcFile);

        // 音频时间更新
        audioPlayer.addEventListener('timeupdate', function() {
            currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
        });

        // 快捷键支持
        document.addEventListener('keydown', function(e) {
            if (!isLyricsConfirmed) return;

            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    if (audioPlayer.paused) {
                        audioPlayer.play();
                    } else {
                        audioPlayer.pause();
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    markCurrentTime();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    currentLineIndex = Math.max(0, currentLineIndex - 1);
                    renderLyricLines();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    currentLineIndex = Math.min(lyricsData.length - 1, currentLineIndex + 1);
                    renderLyricLines();
                    break;
            }
        });
    </script>
</body>
</html>
